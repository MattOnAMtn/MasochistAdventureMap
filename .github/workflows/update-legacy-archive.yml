name: Update legacy trip archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/adventure-map-fullscreen-layers
    paths:
      - scripts/build-legacy-archive.mjs
      - .github/workflows/update-legacy-archive.yml
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: write

concurrency:
  group: legacy-trip-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build archive JSON
        run: node scripts/build-legacy-archive.mjs | tee archive-build.txt
      - name: Add build summary
        if: always()
        run: |
          echo '## Legacy archive update' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat archive-build.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit changed archive data
        run: |
          if git diff --quiet -- data/legacy-archive.json data/legacy-archive-audit.json; then
            echo 'Archive data is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legacy-archive.json data/legacy-archive-audit.json
          git commit -m 'Update legacy trip archive data'
          git push
