name: Inspect CalTopo FCT lines (one-off)

on:
  push:
    paths:
      - '.github/workflows/build-fct-route.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List CalTopo line features
        shell: python
        run: |
          import json, urllib.request
          url = "https://caltopo.com/api/v1/map/0E3MB34/since/0"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.loads(r.read())
          feats = data["result"]["state"]["features"]
          for i, ft in enumerate(feats):
              g=ft.get("geometry") or {}
              if g.get("type") not in ("LineString","MultiLineString"):
                  continue
              p=ft.get("properties") or {}
              coords=g.get("coordinates") or []
              n=len(coords) if g.get("type")=="LineString" else sum(len(s) for s in coords)
              print("LINE", i, "id=",ft.get("id"), "title=",repr(p.get("title")), "class=",p.get("class"), "folderId=",p.get("folderId"), "points=",n)
