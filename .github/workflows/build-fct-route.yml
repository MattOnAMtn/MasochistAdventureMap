name: Inspect CalTopo FCT map (one-off)

on:
  push:
    paths:
      - '.github/workflows/build-fct-route.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect CalTopo response structure
        shell: python
        run: |
          import json, urllib.request
          url = "https://caltopo.com/api/v1/map/0E3MB34/since/0"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
          with urllib.request.urlopen(req, timeout=60) as r:
              raw = r.read()
          data = json.loads(raw)
          print("TOP_TYPE", type(data).__name__)
          if isinstance(data, dict):
              print("TOP_KEYS", sorted(data.keys()))
              for k,v in data.items():
                  print("TOP_FIELD", k, type(v).__name__, (len(v) if hasattr(v,"__len__") else ""))
          state = data.get("state") if isinstance(data, dict) else None
          print("STATE_TYPE", type(state).__name__)
          if isinstance(state, dict):
              print("STATE_KEYS", sorted(state.keys()))
              for k,v in state.items():
                  print("STATE_FIELD", k, type(v).__name__, (len(v) if hasattr(v,"__len__") else ""))
                  if isinstance(v, list):
                      for i,item in enumerate(v[:20]):
                          if isinstance(item, dict):
                              g=item.get("geometry") or {}
                              p=item.get("properties") or {}
                              print("ITEM",k,i,"keys",sorted(item.keys()),"geom",g.get("type"),"class",p.get("class"),"title",repr(p.get("title")))
          elif isinstance(state, list):
              print("STATE_LEN", len(state))
              for i,item in enumerate(state[:30]):
                  if isinstance(item, dict):
                      g=item.get("geometry") or {}
                      p=item.get("properties") or {}
                      print("ITEM",i,"keys",sorted(item.keys()),"geom",g.get("type"),"class",p.get("class"),"title",repr(p.get("title")))
