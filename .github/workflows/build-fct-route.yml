name: Build CalTopo FCT route (one-off)

on:
  push:
    paths:
      - '.github/workflows/build-fct-route.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact GeoJSON from user's CalTopo route
        shell: python
        run: |
          import json, math, pathlib, urllib.request

          url = "https://caltopo.com/api/v1/map/0E3MB34/since/0"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.loads(r.read())

          feats = data["result"]["state"]["features"]
          matches = [
              ft for ft in feats
              if (ft.get("properties") or {}).get("title") == "Fukushima Hamakaido Trail (official)"
              and (ft.get("geometry") or {}).get("type") == "LineString"
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one FCT route line; found {len(matches)}")

          src = matches[0]
          points = [(float(p[0]), float(p[1])) for p in src["geometry"]["coordinates"]]
          print("SOURCE_ID", src.get("id"))
          print("SOURCE_TITLE", (src.get("properties") or {}).get("title"))
          print("SOURCE_POINTS", len(points))
          print("SOURCE_COORD_DIM", len(src["geometry"]["coordinates"][0]))

          def hav(a,b):
              lon1,lat1=map(math.radians,a)
              lon2,lat2=map(math.radians,b)
              dlat=lat2-lat1; dlon=lon2-lon1
              h=math.sin(dlat/2)**2+math.cos(lat1)*math.cos(lat2)*math.sin(dlon/2)**2
              return 6371000*2*math.asin(min(1,math.sqrt(h)))

          def length(pts):
              return sum(hav(a,b) for a,b in zip(pts,pts[1:]))

          mean_lat=sum(lat for _,lat in points)/len(points)
          sx=111320.0*math.cos(math.radians(mean_lat))
          sy=110540.0

          def perp(p,a,b):
              px,py=p[0]*sx,p[1]*sy
              ax,ay=a[0]*sx,a[1]*sy
              bx,by=b[0]*sx,b[1]*sy
              dx,dy=bx-ax,by-ay
              if dx==0 and dy==0:
                  return math.hypot(px-ax,py-ay)
              t=max(0.0,min(1.0,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy)))
              qx,qy=ax+t*dx,ay+t*dy
              return math.hypot(px-qx,py-qy)

          def rdp(pts,eps):
              if len(pts)<=2: return pts
              a,b=pts[0],pts[-1]
              idx,maxd=0,-1.0
              for i in range(1,len(pts)-1):
                  d=perp(pts[i],a,b)
                  if d>maxd: idx,maxd=i,d
              if maxd>eps:
                  left=rdp(pts[:idx+1],eps)
                  right=rdp(pts[idx:],eps)
                  return left[:-1]+right
              return [a,b]

          original_m=length(points)
          simplified=rdp(points,10.0)
          simplified_m=length(simplified)
          coords=[[round(lon,5),round(lat,5)] for lon,lat in simplified]

          out_obj={
              "type":"FeatureCollection",
              "features":[{
                  "type":"Feature",
                  "properties":{
                      "title":"Fukushima Hamakaido Trail",
                      "source":"CalTopo 0E3MB34"
                  },
                  "geometry":{"type":"LineString","coordinates":coords}
              }]
          }
          raw=json.dumps(out_obj,ensure_ascii=False,separators=(",",":"))+"\n"
          out=pathlib.Path("hikes/2026 - Fukushima Coastal Trail Japan.json")
          out.write_text(raw,encoding="utf-8")

          print("ORIGINAL_KM", round(original_m/1000,3))
          print("ORIGINAL_MI", round(original_m/1609.344,3))
          print("SIMPLIFIED_POINTS", len(simplified))
          print("SIMPLIFIED_KM", round(simplified_m/1000,3))
          print("LENGTH_LOSS_PERCENT", round((1-simplified_m/original_m)*100,4))
          print("OUTPUT_BYTES", out.stat().st_size)

      - name: Commit route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "hikes/2026 - Fukushima Coastal Trail Japan.json"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use CalTopo Fukushima Hamakaido route"
            git push
          fi
