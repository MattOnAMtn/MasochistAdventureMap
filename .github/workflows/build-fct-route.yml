name: Inspect CalTopo FCT map (one-off)

on:
  push:
    paths:
      - '.github/workflows/build-fct-route.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect CalTopo map objects
        shell: python
        run: |
          import json, urllib.request
          url = "https://caltopo.com/api/v1/map/0E3MB34/since/0"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  raw = r.read()
                  print("STATUS", r.status)
                  print("CONTENT_TYPE", r.headers.get("content-type"))
                  print("BYTES", len(raw))
          except Exception as e:
              print("FETCH_ERROR", repr(e))
              raise
          data = json.loads(raw)
          state = data.get("state", data)
          feats = state.get("features", []) if isinstance(state, dict) else []
          print("FEATURE_COUNT", len(feats))
          for i, ft in enumerate(feats):
              g = ft.get("geometry") or {}
              p = ft.get("properties") or {}
              typ = g.get("type")
              title = p.get("title")
              cls = p.get("class")
              coords = g.get("coordinates")
              n = 0
              if typ == "LineString" and isinstance(coords, list):
                  n = len(coords)
              elif typ == "MultiLineString" and isinstance(coords, list):
                  n = sum(len(x) for x in coords if isinstance(x, list))
              print("FEATURE", i, "type=", typ, "class=", cls, "title=", repr(title), "points=", n)
