name: Inspect CalTopo FCT map (one-off)

on:
  push:
    paths:
      - '.github/workflows/build-fct-route.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect CalTopo response structure
        shell: python
        run: |
          import json, urllib.request
          url = "https://caltopo.com/api/v1/map/0E3MB34/since/0"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.loads(r.read())
          result = data.get("result", {})
          print("RESULT_KEYS", sorted(result.keys()))
          for k,v in result.items():
              print("RESULT_FIELD", k, type(v).__name__, (len(v) if hasattr(v,"__len__") else ""))
              if isinstance(v, dict):
                  print(" SUBKEYS", k, sorted(v.keys())[:50])
              if isinstance(v, list):
                  for i,item in enumerate(v[:20]):
                      if isinstance(item, dict):
                          g=item.get("geometry") or {}
                          p=item.get("properties") or {}
                          print(" ITEM",k,i,"geom",g.get("type"),"class",p.get("class"),"title",repr(p.get("title")))
          state = result.get("state", {})
          if isinstance(state, dict):
              print("STATE_KEYS", sorted(state.keys()))
              for k,v in state.items():
                  print("STATE_FIELD", k, type(v).__name__, (len(v) if hasattr(v,"__len__") else ""))
                  if isinstance(v, list):
                      for i,item in enumerate(v[:50]):
                          if isinstance(item, dict):
                              g=item.get("geometry") or {}
                              p=item.get("properties") or {}
                              typ=g.get("type")
                              coords=g.get("coordinates")
                              n=len(coords) if typ=="LineString" and isinstance(coords,list) else 0
                              print(" FEATURE",k,i,"geom",typ,"class",p.get("class"),"title",repr(p.get("title")),"points",n)
